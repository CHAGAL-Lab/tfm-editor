name: Build

on:
  pull_request:
  push:
    branches: [develop, main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: build on an older glibc so the Linux binary runs on more distributions.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Build steps are per language.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Install build tools
        run: python -m pip install pyinstaller==6.22.3 pyflakes

      - name: Lint
        run: python -m pyflakes run_gui.py save_editor

      - name: Build executable
        run: pyinstaller packaging/tfm-editor.spec --noconfirm --clean

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/tfm-editor --selftest

      # The Windows build has no console, so read the exit code instead of the output.
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\tfm-editor.exe -ArgumentList '--selftest' -Wait -PassThru
          exit $p.ExitCode

      - uses: actions/upload-artifact@v4
        with:
          name: tfm-editor-${{ runner.os }}
          path: dist/tfm-editor*
          retention-days: 7
